name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Verify TypeScript strictness
        run: npx tsc --noEmit --strict

      - name: Check for diff after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Build produced uncommitted changes. Run 'npm run build' and commit the dist/ output."
            git diff
            exit 1
          fi
